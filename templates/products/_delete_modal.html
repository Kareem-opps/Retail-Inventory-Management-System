<div
    class="modal fade"
    id="deleteProductModal"
    tabindex="-1"
    aria-labelledby="deleteProductModalLabel"
    aria-hidden="true"
>
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title fs-5" id="deleteProductModalLabel">Delete Product</h2>
                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                ></button>
            </div>
            <div class="modal-body">
                <p>
                    Are you sure you want to delete
                    <strong data-delete-product-name>this product</strong>?
                </p>
                <p class="text-muted mb-0">
                    This action cannot be undone. Products used in existing orders will be protected.
                </p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">
                    Cancel
                </button>
                <form id="delete-product-form" method="post" action="#">
                    <button class="btn btn-danger" type="submit">
                        <i class="bi bi-trash" aria-hidden="true"></i>
                        Delete Product
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
